[backend]
precision = double
rank-allocator = linear

[backend-cuda]
device-id = local-rank
mpi-type = standard

[constants]
nu = 1.553418803419e-05
ac-zeta = 1600.000000

[solver]
system = ac-navier-stokes
order = 1
anti-alias = flux

[solver-time-integrator]
formulation = dual
scheme = backward-euler
pseudo-scheme = rk45
controller = none
pseudo-controller = local-pi
tstart = 0.0
tend = 0.120000
dt = 0.020000
pseudo-dt = 0.000500
pseudo-niters-max = 12
pseudo-niters-min = 3
pseudo-resid-tol = 1.0e-5
pseudo-resid-norm = l2
atol = 1.0e-6
safety-fact = 0.9
min-fact = 0.98
max-fact = 1.01
pseudo-dt-max-mult = 3.0

[solver-interfaces]
riemann-solver = rusanov
ldg-beta = 0.5
ldg-tau = 0.1

[solver-interfaces-line]
flux-pts = gauss-legendre
quad-deg = 6
quad-pts = gauss-legendre

[solver-elements-tri]
soln-pts = williams-shunn
quad-deg = 6
quad-pts = williams-shunn

[soln-ics]
p = 0.0
u = 34.600000
v = 0.0

[soln-bcs-inlet]
type = ac-in-fv
u = 34.600000
v = 0.0

[soln-bcs-outlet]
type = ac-out-fp
p = 0.0

[soln-bcs-bottomwall]
type = no-slp-wall
u = 0.0
v = 0.0

[soln-bcs-topwall]
type = slp-wall

[soln-plugin-writer]
basedir = runs/gpu_pyfr_pass2/pass2_field_only/solutions
basename = pass2_field_only
dt-out = 0.020000

[soln-plugin-pseudostats]
file = runs/gpu_pyfr_pass2/pass2_field_only/pseudo_stats
flushsteps = 20

[soln-plugin-fluidforce-bottomwall]
nsteps = 5
file = runs/gpu_pyfr_pass2/pass2_field_only/fluidforce_bottomWall


[soln-plugin-sampler-fieldmini]
nsteps = 5
format = primitive
file = runs/gpu_pyfr_pass2/pass2_field_only/fieldmini
samp-pts = [(-1.350000000, 0.005555556), (-1.113669065, 0.072222222), (-0.877338129, 0.138888889), (-0.641007194, 0.205555556), (-0.404676259, 0.272222222), (-0.168345324, 0.338888889), (0.083741007, 0.188888889), (0.367338129, 0.127777778), (0.603669065, 0.261111111)]
