[backend]
precision = double
rank-allocator = linear

[backend-cuda]
device-id = local-rank
mpi-type = standard

[constants]
gamma = 1.4
mu = 1.902938034188275e-05
Pr = 0.72

[solver]
system = navier-stokes
order = 1
anti-alias = flux
viscosity-correction = none
shock-capturing = none

[solver-time-integrator]
formulation = dual
scheme = backward-euler
pseudo-scheme = rk45
controller = none
pseudo-controller = local-pi
tstart = 0.0
tend = 0.005000
dt = 0.001000
pseudo-dt = 0.0000100
pseudo-niters-max = 14
pseudo-niters-min = 4
pseudo-resid-tol = 1.0e-5
pseudo-resid-norm = l2
atol = 1.0e-8
safety-fact = 0.7
min-fact = 0.90
max-fact = 1.02
pseudo-dt-max-mult = 1.5

[solver-interfaces]
riemann-solver = rusanov
ldg-beta = 0.5
ldg-tau = 0.1

[solver-interfaces-line]
flux-pts = gauss-legendre
quad-deg = 6
quad-pts = gauss-legendre

[solver-elements-tri]
soln-pts = williams-shunn
quad-deg = 6
quad-pts = williams-shunn

[soln-ics]
rho = 1.225000
u = 34.600000
v = 0.0
p = 101325.000000

[soln-bcs-inlet]
type = sub-in-frv
rho = 1.225000
u = 34.600000
v = 0.0

[soln-bcs-outlet]
type = sub-out-fp
p = 101325.000000

[soln-bcs-bottomwall]
type = no-slp-adia-wall

[soln-bcs-topwall]
type = slp-adia-wall

[soln-plugin-writer]
basedir = runs/gpu_pyfr_pass5/current/solutions
basename = pass5_current
dt-out = 0.002500

[soln-plugin-pseudostats]
file = runs/gpu_pyfr_pass5/current/pseudo_stats
flushsteps = 10
