[backend]
precision = double
rank-allocator = linear

[backend-cuda]
device-id = local-rank
mpi-type = standard

[constants]
gamma = 1.4
mu = 1.902938034188275e-05
Pr = 0.72

[solver]
system = navier-stokes
order = 1
anti-alias = flux
viscosity-correction = none
shock-capturing = none

[solver-time-integrator]
formulation = dual
scheme = backward-euler
pseudo-scheme = rk45
controller = none
pseudo-controller = local-pi
tstart = 0.0
tend = 0.000250
dt = 0.0000500
pseudo-dt = 0.000000050
pseudo-niters-max = 24
pseudo-niters-min = 4
pseudo-resid-tol = 1.0e-6
pseudo-resid-norm = l2
atol = 1.0e-10
safety-fact = 0.5
min-fact = 0.80
max-fact = 1.01
pseudo-dt-max-mult = 1.2

[solver-interfaces]
riemann-solver = rusanov
ldg-beta = 0.5
ldg-tau = 0.1

[solver-interfaces-line]
flux-pts = gauss-legendre
quad-deg = 6
quad-pts = gauss-legendre

[solver-elements-tri]
soln-pts = williams-shunn
quad-deg = 6
quad-pts = williams-shunn

[soln-ics]
rho = 1.225000
u = 34.600000
v = 0.0
p = 101325.000000

[soln-bcs-inlet]
type = char-riem-inv
rho = 1.225000
u = 34.600000
v = 0.0
p = 101325.000000

[soln-bcs-outlet]
type = char-riem-inv
rho = 1.225000
p = 101325.000000
u = 34.600000
v = 0.0

[soln-bcs-bottomwall]
type = no-slp-adia-wall

[soln-bcs-topwall]
type = slp-adia-wall

[soln-plugin-writer]
basedir = runs/gpu_pyfr_pass6/stability/pass6_hump_ns_char_dt5e5/solutions
basename = pass6_hump_ns_char_dt5e5
dt-out = 0.0002500

[soln-plugin-pseudostats]
file = runs/gpu_pyfr_pass6/stability/pass6_hump_ns_char_dt5e5/pseudo_stats
flushsteps = 10
