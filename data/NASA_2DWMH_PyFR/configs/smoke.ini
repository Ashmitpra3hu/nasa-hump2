[backend]
precision = double
rank-allocator = linear

[backend-cuda]
device-id = local-rank
mpi-type = standard

[constants]
nu = 1.553418803419e-05
ac-zeta = 1600.000000

[solver]
system = ac-navier-stokes
order = 1
anti-alias = flux

[solver-time-integrator]
formulation = dual
scheme = backward-euler
pseudo-scheme = rk45
controller = none
pseudo-controller = local-pi
tstart = 0.0
tend = 0.250000
dt = 0.050000
pseudo-dt = 0.002000
pseudo-niters-max = 10
pseudo-niters-min = 3
pseudo-resid-tol = 1.0e-5
pseudo-resid-norm = l2
atol = 1.0e-6
safety-fact = 0.9
min-fact = 0.98
max-fact = 1.01
pseudo-dt-max-mult = 3.0

[solver-interfaces]
riemann-solver = rusanov
ldg-beta = 0.5
ldg-tau = 0.1

[soln-ics]
p = 0.0
u = 34.600000
v = 0.0

[soln-bcs-inlet]
type = ac-in-fv
u = 34.600000
v = 0.0

[soln-bcs-outlet]
type = ac-out-fp
p = 0.0

[soln-bcs-bottomWall]
type = no-slp-wall
u = 0.0
v = 0.0

[soln-bcs-topWall]
type = slp-wall

[soln-plugin-writer]
basedir = runs/gpu_pyfr_pass1/smoke_test/solutions
basename = smoke_test
dt-out = 0.062500

[soln-plugin-pseudostats]
file = runs/gpu_pyfr_pass1/smoke_test/pseudo_stats
flushsteps = 20

[soln-plugin-fluidforce-bottomWall]
nsteps = 5
file = runs/gpu_pyfr_pass1/smoke_test/fluidforce_bottomWall
